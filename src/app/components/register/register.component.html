<h2>{{ title }}</h2>

<div>
  <label for="userName">Username</label>
  <input id="userName" type="text" [(ngModel)]="userName" (ngModelChange)="clearDuplicateError()" required>
</div>

<div>
  <label for="email">Email</label>
  <input id="email" type="email" [(ngModel)]="email" (ngModelChange)="clearDuplicateError()" required>
</div>
<br>
<div>
  <label for="password">Password</label>
  <input id="password" type="password" [(ngModel)]="password" required>
</div>
<br>
<div>
  <label for="confirmPassword">Confirm password</label>
  <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" required>
</div>
<br>
<div>
  <label for="role">Role</label>
  <input id="role" type="text" [(ngModel)]="role" required>
</div>
<br>
<p *ngIf="errorMsg">{{ errorMsg }}</p>
<button type="button" (click)="register()" [disabled]="isSubmitting">
  {{ isSubmitting ? 'Creating account...' : 'Create account' }}
</button>
<p>
  Already have an account? <a routerLink="/">Log in</a>
</p>
