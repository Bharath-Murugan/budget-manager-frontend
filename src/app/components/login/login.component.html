<h2> {{ title }}</h2>
<div>
    <label>Email</label>
    <input type="email" [(ngModel)]="email">
</div>
<br>
<div>
    <label>Password</label>
    <input type="password" [(ngModel)]="password">
</div>
<br>
<p *ngIf="errorMsg">
    {{ errorMsg }}
</p>
<button (click)="login()"> Login </button>
